name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # The server reads veilway-proto from ../../veilway/crates, so both repositories sit side by side under one parent folder.
      - uses: actions/checkout@v7
        with:
          path: veilway-project/veilway-panel
      - uses: actions/checkout@v7
        with:
          repository: veilway-project/veilway
          # A release tag builds against the core's tag of the same version, so a hotfix of an older release does not meet the core's newer main.
          ref: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'main' }}
          path: veilway-project/veilway
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: veilway-project/veilway-panel/server
      - run: cargo test
        working-directory: veilway-project/veilway-panel/server
      # Every key of the node's config has a form in the web app or a line in the list of keys left to JSON on purpose.
      - run: node scripts/config-coverage.mjs
        working-directory: veilway-project/veilway-panel/web
  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts && npm run generate && git diff --exit-code src/schema.ts && npm run check && npm test
