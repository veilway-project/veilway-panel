[package]
name="veilway-panel"
version="0.2.8"
edition="2021"
license="Apache-2.0"
publish=false

[lib]
name="veilway_panel"
path="src/lib.rs"

[[bin]]
name="veilway-panel"
path="src/main.rs"

[dependencies]
# A pinned version replaces these paths once the core publishes one.
veilway-proto={path="../../veilway/crates/veilway-proto"}
tokio={version="1", features=["full"]}
axum={version="0.8", default-features=false, features=["http1", "tokio", "json", "query", "matched-path"]}
hyper={version="1", features=["http1", "client"]}
hyper-util={version="0.1", features=["tokio"]}
http-body-util="0.1"
serde={version="1", features=["derive"]}
serde_json="1"
schemars="1"
rusqlite={version="0.37", features=["bundled"]}
argon2="0.5"
ring="0.17"
base64="0.23"
data-encoding="2"
qrcode={version="0.14", default-features=false, features=["svg"]}
rust-embed={version="8", features=["include-exclude"]}
password-hash={version="0.5", features=["getrandom"]}
tracing="0.1"
tracing-subscriber={version="0.3", features=["env-filter"]}
time={version="0.3.36", default-features=false, features=["std", "formatting"]}
ipnet="2"
x25519-dalek={version="2", features=["static_secrets"]}
subtle={version="2.6", default-features=false}
rustls={version="0.23", default-features=false, features=["ring", "std", "tls12"]}
tokio-rustls={version="0.26", default-features=false, features=["ring", "tls12"]}
webpki-roots="1"
libc="0.2"

[dev-dependencies]
tower={version="0.5", features=["util"]}
http-body-util="0.1"
